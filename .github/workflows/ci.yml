name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /var/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/sync_upstream.py --check
      - run: python tools/check_contracts.py
      - name: Generate both native model sets
        run: |
          stage=$(mktemp -d /var/tmp/peru-models.XXXXXXXX)
          python tools/generate.py --language go --output "$stage/go"
          python tools/generate.py --language python --output "$stage/python"
          cd "$stage/go"
          go mod init contracts.example/verification
          go test ./...
